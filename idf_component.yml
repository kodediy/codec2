## Codec 2 for ESP-IDF: the build of David Rowe's low-bitrate speech codec that Meshtastic's firmware uses on the
## ESP32 (meshtastic/ESP32_Codec2, from deulis/ESP32_Codec2), kept by Kode for MeshKode. See README.md.
## For a registry. A git dependency is named after its key instead (esp32_codec2 in MeshKode), and ESP-IDF
## ignores this field for it.
name: "codec2"
version: "1.1.0"
description: "Codec 2 speech codec, 3200 to 700B bit/s (Meshtastic's ESP32 build), as an ESP-IDF component"
url: "https://github.com/kodediy/codec2"
repository: "https://github.com/kodediy/codec2.git"
issues: "https://github.com/kodediy/codec2/issues"
## What the component compiles: the Codec 2 sources (LGPL-2.1, their authors' notices) and kiss_fft (BSD-3-Clause).
## The repository's LICENSE (GPL-3.0) covers the Arduino helpers, which the component does not build; README.md, "Licence".
license: "LGPL-2.1-only AND BSD-3-Clause"
targets:
  - esp32
  - esp32s3
  - esp32p4
tags:
  - codec2
  - audio
  - speech
  - codec
  - meshtastic
dependencies:
  idf: ">=6.1"
files:
  exclude:
    - "hardware.jpg"
    - "examples/**/*"
    - "tools/**/*"
